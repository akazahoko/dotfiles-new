keymode=common
bind=super+shift,f5,reload_config
bind=ctrl+alt+shift+super,escape,setkeymode,default

keymode=default

# switch focus
bind=super,up,focusdir,up
bind=super,down,focusdir,down
bind=super,left,focusdir,left
bind=super,right,focusdir,right
bind=super,h,focusdir,left
bind=super,j,focusdir,down
bind=super,k,focusdir,up
bind=super,l,focusdir,right

# swap window
bind=super+shift,up,exchange_client,up
bind=super+shift,down,exchange_client,down
bind=super+shift,left,exchange_client,left
bind=super+shift,right,exchange_client,right
bind=super+shift,h,exchange_client,left
bind=super+shift,j,exchange_client,down
bind=super+shift,k,exchange_client,up
bind=super+shift,l,exchange_client,right

# Fullscreen
bind=super,a,togglemaximizescreen,
bind=super,f,togglefullscreen,
bind=super+shift,f,togglefakefullscreen,

# tags
bind=super,1,view,1,0
bind=super,2,view,2,0
bind=super,3,view,3,0
bind=super,4,view,4,0
bind=super,5,view,5,0
bind=super,6,view,6,0
bind=super,7,view,7,0
bind=super,8,view,8,0
bind=super,9,view,9,0
bind=super+shift+,1,tag,1,0
bind=super+shift+,2,tag,2,0
bind=super+shift+,3,tag,3,0
bind=super+shift+,4,tag,4,0
bind=super+shift+,5,tag,5,0
bind=super+shift+,6,tag,6,0
bind=super+shift+,7,tag,7,0
bind=super+shift+,8,tag,8,0
bind=super+shift+,9,tag,9,0
bind=super+shift+ctrl,1,tagsilent,1,0
bind=super+shift+ctrl,2,tagsilent,2,0
bind=super+shift+ctrl,3,tagsilent,3,0
bind=super+shift+ctrl,4,tagsilent,4,0
bind=super+shift+ctrl,5,tagsilent,5,0
bind=super+shift+ctrl,6,tagsilent,6,0
bind=super+shift+ctrl,7,tagsilent,7,0
bind=super+shift+ctrl,8,tagsilent,8,0
bind=super+shift+ctrl,9,tagsilent,9,0
bind=super,prior,viewtoleft,0
bind=super,next,viewtoright,0

# overview
bind=alt,tab,switcher,all_tag_next 
bind=super,tab,overcircle

# scroller layout
bind=SUPER+SHIFT,r,set_proportion,1.0
# bind=SUPER,r,switch_proportion_preset,
bind=CTRL+ALT+SUPER,Left,scroller_stack,left
bind=CTRL+ALT+SUPER,Right,scroller_stack,right
bind=CTRL+ALT+SUPER,Up,scroller_stack,up
bind=CTRL+ALT+SUPER,Down,scroller_stack,down

# switch window status
bind=SUPER,g,toggleglobal,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=super,grave,toggle_scratchpad

# spawns
bind=super,space,spawn,fuzzel
bind=super,return,spawn,foot
bind=super,b,spawn,firefox
bind=super,e,spawn,foot yazi

bind=alt+super,space,spawn,~/.local/bin/menus/launcher/dmenu.sh

bind=none,XF86AudioRaiseVolume,spawn,~/.local/bin/osd/volume.sh sink_up
bind=none,XF86AudioLowerVolume,spawn,~/.local/bin/osd/volume.sh sink_down
bind=none,XF86AudioMute,spawn,~/.local/bin/osd/volume.sh sink_mute

bind=ctrl+alt,delete,spawn,~/.local/bin/menus/power/dmenu.sh
bind=super,v,spawn,~/.local/bin/menus/palette/dmenu.sh clipboard
bind=super,f5,spawn,chezmoi apply

# mouse
mousebind=super,btn_left,moveresize,curmove
mousebind=super,btn_middle,togglemaximizescreen,0
mousebind=super,btn_right,moveresize,curresize

# mouse axis
axisbind=super,up,viewtoleft_have_client
axisbind=super,down,viewtoright_have_client
axisbind=super,left,focusdir,left
axisbind=super,right,focusdir,right

# gesture
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview
gesturebind=super,alldir,3,moveresize,curmove

bind=super+shift,m,quit
bind=super,q,killclient
bind=super+shift,q,killclient,force

# keymode
keymode=default
bind=super,r,setkeymode,resize
bind=super+ctrl,f,setkeymode,float
bind=super,t,setkeymode,tag
bind=super,m,setkeymode,monitor

keymode=resize
bind=super,r,setkeymode,default
bind=none,escape,setkeymode,default

bind=none,Up,resizewin,+0,-50
bind=none,Down,resizewin,+0,+50
bind=none,Left,resizewin,-50,+0
bind=none,Right,resizewin,+50,+0

bind=super,up,focusdir,up
bind=super,down,focusdir,down
bind=super,left,focusdir,left
bind=super,right,focusdir,right

bind=none,h,resizewin,-100,+0
bind=none,j,resizewin,+0,+100
bind=none,k,resizewin,+0,-100
bind=none,l,resizewin,+100,+0

bind=super,h,focusdir,left
bind=super,j,focusdir,down
bind=super,k,focusdir,up
bind=super,l,focusdir,right

keymode=float
bind=super+ctrl,f,setkeymode,default
bind=none,escape,setkeymode,default

bind=none,space,togglefloating,
bind=none,c,centerwin

bind=none,up,movewin,+0,-100
bind=none,down,movewin,+0,+100
bind=none,left,movewin,-100,+0
bind=none,right,movewin,+100,+0

bind=none,h,movewin,-100,+0
bind=none,j,movewin,+0,+100
bind=none,k,movewin,+0,-100
bind=none,l,movewin,+100,+0

keymode=tag
bind=super,t,setkeymode,default
bind=none,escape,setkeymode,default

bind=none,left,viewtoleft,0
bind=ctrl,left,viewtoleft_have_client,0
bind=shift,left,tagtoleft,0
bind=none,right,viewtoright,0
bind=ctrl,right,viewtoleft_have_client,0
bind=shift,right,tagtoright,0

bind=none,h,viewtoleft,0
bind=ctrl,h,viewtoleft_have_client,0
bind=shift,h,tagtoleft,0
bind=none,l,viewtoright,0
bind=ctrl,l,viewtoright_have_client,0
bind=shift,l,tagtoright,0

keymode=monitor
bind=super,m,setkeymode,default
bind=none,escape,setkeymode,default

bind=none,left,focusmon,left
bind=none,right,focusmon,right
bind=none,h,focusmon,left
bind=none,l,focusmon,right

bind=shift,left,tagmon,left
bind=shift,right,tagmon,right
bind=shift,h,tagmon,left
bind=shift,l,tagmon,right
