# More option see https://github.com/DreamMaoMao/mango/wiki/

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical

# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overviewgappi=5
overviewgappo=30
overcircle_center_ratio=0.5

# Misc
no_border_when_single=1
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focusdir_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
numlockon=0
xkb_rules_layout=us

# trackpad (need re=login)
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
trackpad_accel_profile=2
trackpad_accel_speed=0.35
swipe_min_threshold=1

# mouse (need re-login)
mouse_natural_scrolling=0

source=./env.conf
source=./layout.conf
source=./binds.conf
source=./effects.conf
source=./rules.conf
source=./monitors.conf
source=~/.cache/wal/colors-mango.conf

# exec
exec-once=waybar
exec-once=fcitx5
exec-once=swaybg -m fill -i ~/.local/share/wallpaper.png
