[global]

source = ["~/.cache/wal/colors-mango.toml"]

# cursor
cursor_theme = "GoogleDot-White"
cursor_size = 24

# blur
blur = 1
blur_layer = 1
blur_optimized = 1
blur_params_radius = 6
blur_params_num_passes = 3
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

# shadow
shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color = 0x000000ff

# border & gaps
border_px = 4
border_radius = 0
no_border_when_single = 0
no_radius_when_single = 0
gap_inner_horizontal = 5
gap_inner_vertical = 5
gap_outer_horizontal = 10
gap_outer_vertical = 10

# scratchpad
scratchpad_width_ratio = 0.8
scratchpad_height_ratio = 0.9

# tab bar
tab_bar_height = 30
tab_bar_decorate_border_width = 0
tab_bar_decorate_corner_radius = 0
tab_bar_decorate_font_desc = "Iosevka Nerd Font Propo 12"

# opacity
focused_opacity = 1.0
unfocused_opacity = 0.85

# animation
animations = 1
animation_type_open = "zoom"
animation_type_close = "zoom"
animation_fade_in = 1
animation_fade_out = 1

layer_animations = 1
layer_animation_type_open = "none"
layer_animation_type_close = "fade"

animation_duration_move = 250
animation_duration_open = 250
animation_duration_tag = 200
animation_duration_close = 300
animation_duration_focus = 250

animation_curve_open = [0.46, 1.0, 0.29, 0.99]
animation_curve_move = [0.46, 1.0, 0.29, 0.99]
animation_curve_tag = [0.46, 1.0, 0.29, 0.99]
animation_curve_close = [0.46, 1.0, 0.29, 0.99]
animation_curve_focus = [0.46, 1.0, 0.29, 0.99]
animation_curve_opacity_fade_in = [0.46, 1.0, 0.29, 0.99]
animation_curve_opacity_fade_out = [0.5, 0.5, 0.5, 0.5]

tag_animation_direction = 1
zoom_initial_ratio = 0.4
zoom_end_ratio = 0.8
fade_in_begin_opacity = 0.5
fade_out_begin_opacity = 0.8
